# SPDX-License-Identifier: CC0-1.0
# OnePlus 9 Pro ultrawide camera (IMX766); the sensor black level is 64 (10-bit)
#
# The colour correction matrices are stock OxygenOS/LineageOS normal-light tuning
# (com.qti.tuned.sunny_imx766.bin). Stock holds each matrix flat across a colour-temperature
# range and blends between ranges; listing each matrix at both ends of its range
# makes libcamera's linear interpolation do the same.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Ccm:
      ccms:
        - ct: 2450
          ccm: [  1.9850, -1.1732,  0.1882,
                 -0.3454,  1.2902,  0.0552,
                 -0.0974, -0.9713,  2.0686 ]
        - ct: 2650
          ccm: [  1.9059, -1.0212,  0.1153,
                 -0.3038,  1.2789,  0.0249,
                 -0.0322, -0.9991,  2.0313 ]
        - ct: 3400
          ccm: [  1.9059, -1.0212,  0.1153,
                 -0.3038,  1.2789,  0.0249,
                 -0.0322, -0.9991,  2.0313 ]
        - ct: 3650
          ccm: [  1.8179, -0.9916,  0.1738,
                 -0.2285,  1.3863, -0.1578,
                  0.0637, -0.8192,  1.7555 ]
        - ct: 4500
          ccm: [  1.8179, -0.9916,  0.1738,
                 -0.2285,  1.3863, -0.1578,
                  0.0637, -0.8192,  1.7555 ]
        - ct: 4850
          ccm: [  1.6290, -0.6157, -0.0133,
                 -0.2767,  1.4086, -0.1320,
                  0.0229, -0.9277,  1.9048 ]
  - Adjust:
  - Agc:
  - Af:
...
