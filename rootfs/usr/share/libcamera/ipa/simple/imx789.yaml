# SPDX-License-Identifier: CC0-1.0
# OnePlus 9 Pro main camera (IMX789); the sensor black level is 64 (10-bit)
#
# The colour correction matrices are stock OxygenOS/LineageOS normal-light tuning
# (com.qti.tuned.semco_imx789.bin). Stock holds each matrix flat across a colour-temperature
# range and blends between ranges; listing each matrix at both ends of its range
# makes libcamera's linear interpolation do the same.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Ccm:
      ccms:
        - ct: 2450
          ccm: [  1.3908, -0.2902, -0.1006,
                 -0.3540,  1.7437, -0.3897,
                 -0.0894, -0.7040,  1.7935 ]
        - ct: 2650
          ccm: [  1.4277, -0.3257, -0.1020,
                 -0.3711,  1.7711, -0.4000,
                 -0.0984, -0.7523,  1.8507 ]
        - ct: 3150
          ccm: [  1.4277, -0.3257, -0.1020,
                 -0.3711,  1.7711, -0.4000,
                 -0.0984, -0.7523,  1.8507 ]
        - ct: 3650
          ccm: [  1.7589, -0.5514, -0.2075,
                 -0.2576,  1.6562, -0.3986,
                 -0.0149, -0.4569,  1.4718 ]
        - ct: 4550
          ccm: [  1.7589, -0.5514, -0.2075,
                 -0.2576,  1.6562, -0.3986,
                 -0.0149, -0.4569,  1.4718 ]
        - ct: 4850
          ccm: [  1.7620, -0.6082, -0.1538,
                 -0.2843,  1.6837, -0.3994,
                 -0.0499, -0.5724,  1.6223 ]
  - Adjust:
  - Agc:
  - Af:
...
