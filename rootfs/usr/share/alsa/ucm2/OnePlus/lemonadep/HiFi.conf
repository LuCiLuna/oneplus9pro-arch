# OnePlus 9 Pro (lemonadep)
# Speakers: two TFA9874 on tertiary MI2S (left slot top/earpiece, right slot bottom).
#   The earpiece is the top amplifier alone, switched to the stock "receiver" profile.
#   Speaker/Earpiece and Mic/Headset share a PCM, so PipeWire offers each pair as two
#   ports of one sink or source; each device's EnableSequence sets the whole route.
# Headphones and headset mic: WCD9380 through the USB-C FSA4480 switch (analog adapters).
# Mics: DMIC1 and DMIC3 read by the TX macro (stock "handset-mic" routing).

SectionVerb {
	EnableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia3' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia3' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='Top Profile' Speaker"
		cset "name='Top Playback Switch' 1"
		cset "name='Bottom Playback Switch' 1"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	EnableSequence [
		cset "name='Bottom Playback Switch' 0"
		cset "name='Top Profile' Receiver"
		cset "name='Top Playback Switch' 1"
	]

	DisableSequence [
		cset "name='Top Profile' Speaker"
		cset "name='Bottom Playback Switch' 1"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	Include.wcdhpe.File "/codecs/wcd938x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd938x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},2"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Built-in microphones"

	EnableSequence [
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='TX DMIC MUX0' DMIC1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX DEC1 MUX' MSM_DMIC"
		cset "name='TX DMIC MUX1' DMIC3"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='TX_DEC1 Volume' 84"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone"

	Include.wcdmice.File "/codecs/wcd938x/HeadphoneMicEnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd938x/HeadphoneMicDisableSeq.conf"

	# WCD938x ADC2 (the USB-C headset mic) reaches the TX macro as SoundWire
	# input 1, called ADC1 here. Both channels carry it, so calls don't get a
	# silent channel.
	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' ADC1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='TX_DEC1 Volume' 84"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
	]

	Value {
		CapturePriority 150
		CapturePCM "hw:${CardId},1"
		JackControl "Mic Jack"
	}
}
