# Reboot instead of hanging. A stuck kernel otherwise keeps the phone awake and hot
# until someone holds power. Every reset on this phone clears RAM, so ramoops keeps
# nothing: op9-lockup-watch reboots first, after the report has reached the journal.
# These panics are the fallback for when userspace can't run any more.
#
# Report tasks stuck in D state for 3 minutes; op9-lockup-watch reboots on it.
kernel.hung_task_timeout_secs = 180
kernel.hung_task_panic = 0
# A CPU looping in the kernel: report after 20 s (op9-lockup-watch reboots),
# panic after 6 x 20 s. Interrupts off on a CPU for 10 s: panic.
kernel.softlockup_panic = 6
kernel.hardlockup_panic = 1
# Workqueue stalls are reported after 30 s; op9-lockup-watch reboots on them.
