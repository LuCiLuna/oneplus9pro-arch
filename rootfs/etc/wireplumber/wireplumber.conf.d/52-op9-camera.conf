# The CAMSS video nodes are raw pipeline taps; libcamera owns the camera
# (and handles USB webcams too), so skip the plain V4L2 monitor.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
  }
}

# Name the OnePlus 9 Pro cameras
monitor.libcamera.rules = [
  {
    matches = [ { node.name = "~libcamera_input.*cci_ac4f000_i2c-bus_0_camera_1a" } ]
    actions = { update-props = { node.description = "Main Camera" } }
  }
  {
    matches = [ { node.name = "~libcamera_input.*cci_ac4f000_i2c-bus_1_camera_1a" } ]
    actions = { update-props = { node.description = "Ultrawide Camera" } }
  }
  {
    matches = [ { node.name = "~libcamera_input.*cci_ac50000_i2c-bus_0_camera_36" } ]
    actions = { update-props = { node.description = "Telephoto Camera" } }
  }
  {
    matches = [ { node.name = "~libcamera_input.*cci_ac50000_i2c-bus_1_camera_10" } ]
    actions = { update-props = { node.description = "Front Camera" } }
  }
  {
    # Mono helper camera: the libcamera software ISP has no greyscale path
    # yet, so it only offers packed raw frames that apps cannot show
    matches = [ { node.name = "~libcamera_input.*cci_ac4f000_i2c-bus_1_camera_37" } ]
    actions = { update-props = { node.disabled = true } }
  }
]
