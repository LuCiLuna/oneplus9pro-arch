# OnePlus 9 Pro: q6asm 24-bit capture returns mis-packed samples; the DSP
# path runs 16-bit anyway (sm8250 backend fixup), so stay at S16LE.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_(input|output).platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
