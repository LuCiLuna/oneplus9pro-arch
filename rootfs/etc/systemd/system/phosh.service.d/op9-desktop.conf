[Unit]
# only one of Phosh and desktop mode owns the screens
Conflicts=op9-desktop.service
After=op9-desktop.service

[Service]
# When a compositor exits, nobody owns the display until the next one starts. The kernel
# console then redraws and commits its own layout onto every screen, and leaves planes the
# next compositor can't move ("switching CRTC directly", EINVAL on every flip). ExecStop runs
# before the compositor is stopped, so unbind the console there; the boot messages have been
# shown by then. Before starting, detach any plane still left over from the last owner.
ExecStartPre=+/usr/local/bin/op9-kms-reset
ExecStop=+/usr/local/bin/op9-kms-reset --console-off
