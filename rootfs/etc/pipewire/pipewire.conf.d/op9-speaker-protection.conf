# Interim speaker protection for the OnePlus 9 Pro (needs the swh-plugins package).
#
# Stock Android protects the speakers with a thermal and excursion model running on
# the audio DSP, which Linux can't use. This is a simpler guard: a 300 Hz high-pass
# removes bass the small speakers can't reproduce but would still try to move for,
# and a lookahead limiter keeps peaks 3 dB below full scale.
#
# It's a WirePlumber "smart filter": it sits in front of the speaker sink only, so
# the earpiece, headphones and Bluetooth bypass it and it never shows as an output.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Speaker protection"
            media.name       = "Speaker protection"
            filter.graph = {
                nodes = [
                    { type = builtin name = hpl label = bq_highpass control = { "Freq" = 300.0 "Q" = 0.707 } }
                    { type = builtin name = hpr label = bq_highpass control = { "Freq" = 300.0 "Q" = 0.707 } }
                    {   type   = ladspa
                        name   = limiter
                        plugin = fast_lookahead_limiter_1913
                        label  = fastLookaheadLimiter
                        control = { "Input gain (dB)" = 0.0 "Limit (dB)" = -3.0 "Release time (s)" = 0.1 }
                    }
                ]
                links = [
                    { output = "hpl:Out" input = "limiter:Input 1" }
                    { output = "hpr:Out" input = "limiter:Input 2" }
                ]
                inputs  = [ "hpl:In" "hpr:In" ]
                outputs = [ "limiter:Output 1" "limiter:Output 2" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name          = "effect_input.op9_speaker_protection"
                media.class        = Audio/Sink
                filter.smart       = true
                filter.smart.name  = "op9-speaker-protection"
                filter.smart.target = { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
            }
            playback.props = {
                node.name    = "effect_output.op9_speaker_protection"
                node.passive = true
            }
        }
    }
]
